<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Invitation</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #ff758c, #ff7eb3);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      background: rgba(0, 0, 0, 0.4);
      padding: 30px;
      border-radius: 20px;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .buttons {
      margin-top: 20px;
    }

    button {
      padding: 12px 20px;
      margin: 10px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .yes {
      background-color: #4CAF50;
      color: white;
    }

    .no {
      background-color: #f44336;
      color: white;
      position: relative;
    }

    button:hover {
      transform: scale(1.1);
    }

    #response {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hello there! 😊</h1>
    <p>
      I’ve really loved getting to know you, and I’d love the chance to know you even more.
      There’s something about you that makes me curious—in a good way.
      
      So I was wondering...
    </p>

    <h2>Would you like to go on a date with me? Maybe we could grab coffee or dinner? 💕</h2>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">Yes 💖</button>
      <button class="no" onmouseover="moveButton()">No 😢</button>
    </div>

    <div id="response"></div>
  </div>

  <script>
    function sayYes() {
      document.getElementById("response").innerHTML = "Yay! See you soon! 😊";
    }

    function moveButton() {
      const button = document.querySelector('.no');
      const x = Math.random() * 300 - 150;
      const y = Math.random() * 300 - 150;
      button.style.transform = `translate(${x}px, ${y}px)`;
    }
  </script>
</body>
</html>
